services:
  - type: web
    name: dezny-api
    runtime: docker
    repo: https://github.com/Klyntech/Dezny
    branch: main
    region: frankfurt
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT}'"
    healthCheckPath: /healthz
    envVars:
      - key: DEZNY_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: OCR_ENABLED
        value: "true"
      - key: S3_REGION
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: DEZNY_API_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  - type: worker
    name: dezny-ingestion-worker
    runtime: docker
    repo: https://github.com/Klyntech/Dezny
    branch: main
    region: frankfurt
    plan: starter
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker
    envVars:
      - key: DEZNY_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: OCR_ENABLED
        value: "true"
      - key: S3_REGION
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
