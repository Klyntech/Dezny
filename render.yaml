services:
  - type: web
    name: dezny-api
    runtime: docker
    repo: https://github.com/Klyntech/Dezny
    branch: main
    region: frankfurt
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./start-api.sh
    healthCheckPath: /healthz
    envVars:
      - key: DEZNY_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: OCR_ENABLED
        value: "true"
      - key: S3_REGION
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: DEZNY_API_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  - type: worker
    name: dezny-ingestion-worker
    runtime: docker
    repo: https://github.com/Klyntech/Dezny
    branch: main
    region: frankfurt
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./start-worker.sh
    envVars:
      - key: DEZNY_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: OCR_ENABLED
        value: "true"
      - key: S3_REGION
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: dezny-telegram-bot
    runtime: docker
    repo: https://github.com/Klyntech/Dezny
    branch: main
    region: frankfurt
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.telegram_bot
    envVars:
      - key: DEZNY_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEZNY_API_URL
        value: https://dezny-api.onrender.com
      - key: DEZNY_API_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
